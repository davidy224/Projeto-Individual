<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valora - Cadastro</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@500&family=Barlow:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/inicial.css">
</head>
<body class="pagina-cadastro">

  <div class="fundo">
    <div class="card">
      <a class="marca" href="index.html">Valora</a>
      <h1>Criar conta</h1>

      <form id="formCadastro">
        <label for="nome">Nome</label>
        <input type="text" id="nome">

        <label for="nick">Nick no jogo</label>
        <input type="text" id="nick" placeholder="Jett_BR#1234">

        <label for="email">E-mail</label>
        <input type="text" id="email">

        <div class="linha">
          <div>
            <label for="senha">Senha</label>
            <input type="password" id="senha">
          </div>
          <div>
            <label for="confirmar">Confirmar senha</label>
            <input type="password" id="confirmar">
          </div>
        </div>

        <div class="linha">
          <div>
            <label for="rank">Rank atual</label>
            <select id="rank">
          <option>Ferro 1</option>
          <option>Ferro 2</option>
          <option>Ferro 3</option>
          <option>Bronze 1</option>
          <option>Bronze 2</option>
          <option>Bronze 3</option>
          <option>Prata 1</option>
          <option>Prata 2</option>
          <option>Prata 3</option>
          <option>Ouro 1</option>
          <option>Ouro 2</option>
          <option>Ouro 3</option>
          <option>Platina 1</option>
          <option>Platina 2</option>
          <option>Platina 3</option>
          <option>Diamante 1</option>
          <option>Diamante 2</option>
          <option>Diamante 3</option>
          <option>Ascendente 1</option>
          <option>Ascendente 2</option>
          <option>Ascendente 3</option>
          <option>Imortal 1</option>
          <option>Imortal 2</option>
          <option>Imortal 3</option>
          <option>Radiante</option>
            </select>
          </div>
          <div>
            <label for="pontos">Pontos (RR)</label>
            <input type="number" id="pontos" min="0" placeholder="47">
          </div>
        </div>

        <p id="mensagem"></p>

        <button type="submit">Criar conta</button>
      </form>

      <p class="rodape">Já tem conta? <a href="login.html">Entrar</a></p>
    </div>
  </div>

  <script src="js/cadastro.js"></script>
</body>
</html>
