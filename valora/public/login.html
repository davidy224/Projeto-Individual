<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valora - Login</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@500&family=Barlow:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/inicial.css">
</head>
<body class="pagina-login">

  <div class="fundo">
    <div class="card">
      <a class="marca" href="index.html">Valora</a>
      <h1>Entrar</h1>

      <form id="formLogin">
        <label for="email">E-mail</label>
        <input type="text" id="email">

        <label for="senha">Senha</label>
        <input type="password" id="senha">

        <p id="mensagem"></p>

        <button type="submit">Entrar</button>
      </form>

      <p class="rodape">Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
